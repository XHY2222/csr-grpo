# Row 10 — gold-reward reference. NOT a method: is_reference marks it, and the
# supervision ledger still records every L3 read separately from training.
method: gold_reference
reward_source: gold
is_reference: true
stages_to_run: [1, 2, 3, 4]
seed: 0
model:
  backend: toy
  r_shared: 0
  r_actor: 64
  r_judge: 64
train:
  group_size: 8
  lr: 1.0e-5
data:
  audit_prompts: 200
